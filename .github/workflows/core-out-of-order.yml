name: CORE out-of-order concurrency integrity
on:
  push:
    branches: [feat/core-runtime-foundation-001]
    paths: ['.github/workflows/core-out-of-order.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/okikorg/orca-harness.git /tmp/orca
          git -C /tmp/orca rev-parse HEAD > orca-revision.txt
          cp experiments/paired-offline/orca-out-of-order.rs /tmp/orca/crates/harness-core/examples/core_out_of_order.rs
          (cd /tmp/orca && cargo build --locked --release -p orca-harness-core --example core_out_of_order)
          cp /tmp/orca/target/release/examples/core_out_of_order .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: out-of-order-binary
          path: |
            core_out_of_order
            orca-revision.txt
  validate:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: reverse
            index: 0
          - mode: alternating
            index: 7
          - mode: middle-long
            index: 15
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_FANOUT: '16'
      CORE_REPS: '10'
      CORE_DELAY_MODE: ${{ matrix.mode }}
      CORE_FAILURE_INDEX: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: out-of-order-binary
          path: bin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix experiments/paired-offline --no-save --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@1.3.0 @earendil-works/pi-ai@1.3.0 typebox@1.3.27
      - name: Check completion inversion, ordered results, and fault mapping
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/core_out_of_order
          node experiments/paired-offline/pi-out-of-order.mjs > pi.json
          bin/core_out_of_order > orca.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          for name in ('pi','orca'):
              obj=json.loads(Path(name+'.json').read_text())
              assert len(obj['records'])==10
              assert all(r['correct'] and r['observedError'] and r['delayMode']==os.environ['CORE_DELAY_MODE'] and r['failureIndex']==int(os.environ['CORE_FAILURE_INDEX']) for r in obj['records'])
              print(json.dumps({'candidate':name,'mode':os.environ['CORE_DELAY_MODE'],'validated':10}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: out-of-order-${{ matrix.mode }}
          path: |
            pi.json
            orca.json
          if-no-files-found: warn
