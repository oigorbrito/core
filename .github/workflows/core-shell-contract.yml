name: CORE shell host contract
on:
  push:
    branches: [feat/core-runtime-foundation-001]
    paths:
      - 'bench/shell/**'
      - '.github/workflows/core-shell-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-shell-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 bench/shell/shell_host_baseline.py | tee shell-host-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shell-host-baseline
          path: shell-host-result.json
