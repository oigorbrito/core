name: CORE real task local-only contract
on:
  push:
    branches: [feat/core-runtime-foundation-001]
    paths:
      - 'bench/real-task/**'
      - '.github/workflows/core-real-task-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-preflight-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cd bench/real-task && python3 -m unittest -v test_preflight.py
  consumption-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node bench/real-task/test-analyzer.mjs
  speed-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node bench/real-task/test-analyzer.mjs
  efficacy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node bench/real-task/test-analyzer.mjs
# Unit/contract verification only. No Ollama or real task inference is run here.
