name: CORE offline repeated lifecycle stress
on:
  push:
    branches: [feat/core-runtime-foundation-001]
    paths: ['.github/workflows/core-lifecycle-stress.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pi-lifecycle-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Repeat agent lifecycle with bounded observations
        run: |
          mkdir /tmp/pi-stress && cd /tmp/pi-stress
          npm init -y >/dev/null
          npm install --save-exact @mariozechner/pi-agent-core --ignore-scripts --no-audit --no-fund
          node --expose-gc --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {Agent} from '@mariozechner/pi-agent-core';
          const rss=[];
          for(let i=0;i<1000;i++){
            const agent=new Agent();
            const unsubscribe=agent.subscribe(()=>{});
            await agent.abort();
            unsubscribe();
            agent.reset();
            assert.ok(agent.state);
            if(i%100===99){global.gc();rss.push(process.memoryUsage().rss)}
          }
          console.log(JSON.stringify({cycles:1000,rss_bytes_by_100_cycles:rss}));
          assert.equal(rss.length,10);
          assert.ok(rss.every(Number.isFinite));
          console.log('PI_OFFLINE_STRESS_PASS');
          JS
  orca-kernel-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Clone Orca
        run: |
          git clone --depth=1 https://github.com/okikorg/orca-harness.git orca
          git -C orca rev-parse HEAD
      - name: Repeat kernel unit suite three times without model API
        run: |
          cd orca
          cargo test --locked -p orca-harness-core --lib
          for i in 1 2 3; do
            echo "ORCA_KERNEL_STRESS_REPETITION=$i"
            cargo test --locked -p orca-harness-core --lib -- --test-threads=1
          done
      - name: Scope declaration
        run: echo 'Pi 1000 lifecycle cycles vs Orca repeated kernel suite are DIFFERENT workloads; do not report comparative superiority.'
