name: CORE measured concurrency caps
on:
  push:
    branches: [feat/core-runtime-foundation-001]
    paths: ['.github/workflows/core-concurrency-caps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/okikorg/orca-harness.git /tmp/orca
          git -C /tmp/orca rev-parse HEAD > orca-revision.txt
          cp experiments/paired-offline/orca-concurrency-cap.rs /tmp/orca/crates/harness-core/examples/core_concurrency_cap.rs
          (cd /tmp/orca && cargo build --locked --release -p orca-harness-core --example core_concurrency_cap)
          cp /tmp/orca/target/release/examples/core_concurrency_cap .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: concurrency-binary
          path: |
            core_concurrency_cap
            orca-revision.txt
  cap:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        concurrency: [1, 3, 12]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_CONCURRENCY: ${{ matrix.concurrency }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: concurrency-binary
          path: bin
      - name: Assert peak concurrency equals configured cap
        shell: bash
        run: |
          chmod +x bin/core_concurrency_cap
          bin/core_concurrency_cap > results.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads(Path('results.json').read_text())['records']
          cap=int(os.environ['CORE_CONCURRENCY'])
          assert len(rows)==10
          assert all(r['cap']==cap and r['peak']==cap and r['executed']==12 and r['correct'] for r in rows)
          print(json.dumps({'cap':cap,'runs':10,'pass':True}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: concurrency-cap-${{ matrix.concurrency }}
          path: results.json
          if-no-files-found: warn
