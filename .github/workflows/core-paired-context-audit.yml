name: CORE paired speed and context audit
on:
  push:
    branches: [feat/core-runtime-foundation-001]
    paths:
      - '.github/workflows/core-paired-context-audit.yml'
      - 'experiments/paired-offline/pi-context-audit.mjs'
      - 'experiments/paired-offline/orca-context-audit.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/okikorg/orca-harness.git /tmp/orca
          git -C /tmp/orca rev-parse HEAD > orca-revision.txt
          cp experiments/paired-offline/orca-context-audit.rs /tmp/orca/crates/harness-core/examples/core_context_audit.rs
          (cd /tmp/orca && cargo build --locked --release -p orca-harness-core --example core_context_audit)
          cp /tmp/orca/target/release/examples/core_context_audit .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-audit-binary
          path: |
            core_context_audit
            orca-revision.txt
  compare:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        fanout: [1,4,16]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CORE_FANOUT: ${{ matrix.fanout }}
      CORE_REPS: '30'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: context-audit-binary
          path: bin
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix experiments/paired-offline --no-save --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@1.3.0 @earendil-works/pi-ai@1.3.0 typebox@1.3.27
      - name: Compare complete scripted loops and measured context bytes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/core_context_audit
          for scenario in normal fault; do
            if [[ "$scenario" == fault ]]; then export CORE_INJECT_FAILURE=1; else unset CORE_INJECT_FAILURE || true; fi
            node experiments/paired-offline/pi-context-audit.mjs > "pi-$scenario.json"
            bin/core_context_audit > "orca-$scenario.json"
          done
          python3 - <<'PY'
          import json,os,statistics
          from pathlib import Path
          n=int(os.environ['CORE_FANOUT'])
          for scenario in ('normal','fault'):
              data={}
              for agent in ('pi','orca'):
                  rows=json.loads(Path(f'{agent}-{scenario}.json').read_text())['records']
                  assert len(rows)==30
                  assert all(r['correct'] and r['turns']==2 and r['executed']==n and r['uniqueSources']==n and r['contextBytes']>0 and r['contextMessages']>=2 and r['observedError']==(scenario=='fault') for r in rows)
                  data[agent]={'medianLoopMs':round(statistics.median(r['elapsed_ms'] for r in rows),5),'medianContextBytes':statistics.median(r['contextBytes'] for r in rows),'medianContextMessages':statistics.median(r['contextMessages'] for r in rows)}
              print(json.dumps({'fanout':n,'scenario':scenario,'agents':data,'warning':'Context JSON byte sizes are implementation serialization proxies, NOT model prompt tokens or provider wire payload'}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-paired-context-${{ matrix.fanout }}
          path: '*-*.json'
          if-no-files-found: warn
