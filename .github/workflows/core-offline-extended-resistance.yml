name: CORE offline extended resistance Pi and Orca
on:
  push:
    branches: [feat/core-runtime-foundation-001]
    paths: ['.github/workflows/core-offline-extended-resistance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pi-extended-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: 5000 offline lifecycle cycles with memory snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pi-extended
          cd /tmp/pi-extended
          npm init -y >/dev/null
          npm install --save-exact @mariozechner/pi-agent-core@0.73.1 --ignore-scripts --no-audit --no-fund
          node --expose-gc --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { Agent } from '@mariozechner/pi-agent-core';
          const readings = [];
          const start = performance.now();
          for (let i = 0; i < 5000; i++) {
            const agent = new Agent();
            const unsubscribe = agent.subscribe(() => {});
            await agent.abort();
            unsubscribe();
            agent.reset();
            assert.ok(agent.state);
            if ((i + 1) % 500 === 0) {
              global.gc();
              readings.push({cycles: i + 1, rssBytes: process.memoryUsage().rss});
            }
          }
          assert.equal(readings.length, 10);
          assert.ok(readings.every(r => Number.isFinite(r.rssBytes)));
          console.log(JSON.stringify({project:'Pi', kind:'lifecycle', cycles:5000, elapsedMs:performance.now()-start, readings}));
          console.log('PI_EXTENDED_LIFECYCLE_PASS');
          JS
  orca-extended-core-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Clone Orca source and preserve exact revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/okikorg/orca-harness.git orca
          git -C orca rev-parse HEAD
      - name: Repeat offline Orca core library tests five times
        shell: bash
        run: |
          set -euo pipefail
          cd orca
          for i in 1 2 3 4 5; do
            echo "ORCA_CORE_REPEAT $i"
            cargo test --locked -p orca-harness-core --lib -- --test-threads=1
          done
          echo 'ORCA_EXTENDED_REGRESSION_PASS'
